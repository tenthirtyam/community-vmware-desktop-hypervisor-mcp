---
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: make install-dev
      - name: Run Linters
        run: make lint
      - name: Run Typecheck
        run: make typecheck
      - name: Run Tests
        env:
          PYTHONPATH: src
        run: make test
